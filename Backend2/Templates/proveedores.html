<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Proveedores</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Rajdhani', sans-serif;
    background: #0a0a0a; color: #e8e8e8;
    min-height: 100vh; padding: 30px 20px;
    background-image:
      linear-gradient(rgba(255,46,46,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,46,46,.03) 1px, transparent 1px);
    background-size: 50px 50px;
  }
  body::before {
    content: ''; position: fixed; top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, #ff2e2e, #ff6a00, #ff2e2e);
    z-index: 100; box-shadow: 0 0 20px rgba(255,46,46,.6);
  }
  .container {
    max-width: 1150px; margin: 0 auto;
    background: #141414; border: 1px solid #2a2a2a;
    border-left: 4px solid #ff2e2e;
    padding: 35px;
    box-shadow: 0 20px 60px rgba(0,0,0,.8);
    animation: fadeUp .5s ease;
    position: relative;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(15px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  nav { display: flex; gap: 0; margin-bottom: 30px;
        border-bottom: 2px solid #2a2a2a; flex-wrap: wrap; }
  nav a { text-decoration: none; padding: 14px 24px;
          font-family: 'Oswald', sans-serif; font-weight: 600;
          font-size: .9rem; letter-spacing: 2px; text-transform: uppercase;
          color: #8a8a8a; border-bottom: 3px solid transparent;
          margin-bottom: -2px; transition: all .2s ease; }
  nav a:hover { color: #fff; border-bottom-color: #ff2e2e;
                background: linear-gradient(180deg, transparent, rgba(255,46,46,.08)); }

  h1 {
    font-family: 'Oswald', sans-serif;
    font-size: 2.2rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 3px;
    margin-bottom: 25px; color: #fff;
    padding-left: 18px; position: relative;
  }
  h1::before {
    content: ''; position: absolute; left: 0; top: 8px; bottom: 8px;
    width: 6px;
    background: linear-gradient(180deg, #ff6a00, #ff2e2e);
    box-shadow: 0 0 15px rgba(255,106,0,.7);
  }
  h2 {
    font-family: 'Oswald', sans-serif;
    font-size: 1.05rem; margin: 22px 0 15px;
    color: #e8e8e8; font-weight: 600;
    text-transform: uppercase; letter-spacing: 2px;
    display: flex; align-items: center; gap: 10px;
  }
  h2::before {
    content: ''; width: 8px; height: 8px;
    background: #ff6a00; box-shadow: 0 0 10px #ff6a00;
    transform: rotate(45deg);
  }

  table {
    width: 100%; border-collapse: collapse; margin-top: 15px;
    font-size: .95rem; background: #1c1c1c;
    border: 1px solid #2a2a2a;
  }
  th, td {
    text-align: left; padding: 14px 12px;
    border-bottom: 1px solid #2a2a2a;
  }
  th {
    background: #000;
    font-family: 'Oswald', sans-serif;
    color: #ff6a00; font-weight: 600;
    text-transform: uppercase; font-size: .75rem;
    letter-spacing: 2px; border-bottom: 2px solid #ff6a00;
  }
  tbody tr {
    transition: all .15s ease;
    border-left: 3px solid transparent;
  }
  tbody tr:hover {
    background: rgba(255,106,0,.04);
    border-left-color: #ff6a00;
  }

  .btn {
    padding: 10px 18px; text-decoration: none;
    font-family: 'Oswald', sans-serif;
    font-size: .8rem; font-weight: 600;
    letter-spacing: 1.5px; text-transform: uppercase;
    border: none; cursor: pointer; transition: all .2s ease;
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
  }
  .btn-warning { background: #ff6a00; color: #000; }
  .btn-warning:hover {
    background: #ff8533; box-shadow: 0 0 20px rgba(255,106,0,.6);
    transform: translateY(-2px);
  }
  .btn-danger { background: #ff2e2e; color: #fff; }
  .btn-danger:hover {
    background: #ff5555; box-shadow: 0 0 20px rgba(255,46,46,.7);
    transform: translateY(-2px);
  }
  .btn-success {
    background: linear-gradient(135deg, #e62e2e, #b30000);
    color: #fff; padding: 12px 28px; font-size: .85rem;
    box-shadow: 0 0 25px rgba(255,46,46,.4);
  }
  .btn-success:hover {
    background: linear-gradient(135deg, #ff3a3a, #d40000);
    box-shadow: 0 0 35px rgba(255,46,46,.8);
    transform: translateY(-2px);
  }

  .card {
    background: #1c1c1c; border: 1px solid #2a2a2a;
    border-top: 3px solid #ff2e2e;
    padding: 22px; margin-bottom: 25px;
    transition: all .25s ease;
  }
  .card:hover {
    border-top-color: #ff6a00;
    box-shadow: 0 0 30px rgba(255,106,0,.1);
  }

  .form-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 14px; margin-bottom: 16px;
  }
  input, select {
    padding: 12px 14px; background: #000;
    border: 1px solid #2a2a2a; border-left: 3px solid #ff6a00;
    color: #e8e8e8; font-family: 'Rajdhani', sans-serif;
    font-size: 1rem; font-weight: 600; letter-spacing: .5px;
    width: 100%; transition: all .2s ease;
  }
  input::placeholder { color: #555; text-transform: uppercase; font-size: .85rem; letter-spacing: 1px; }
  input:focus, select:focus {
    outline: none; border-color: #ff6a00;
    border-left-color: #ff2e2e; background: #0f0f0f;
    box-shadow: 0 0 0 3px rgba(255,106,0,.15);
  }

  .flash {
    padding: 14px 20px; margin-bottom: 20px;
    font-family: 'Oswald', sans-serif;
    text-transform: uppercase; letter-spacing: 1.5px;
    font-size: .9rem;
    background: rgba(46,204,113,.1); color: #2ecc71;
    border-left: 4px solid #2ecc71;
    animation: slideIn .4s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-20px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  .empty {
    text-align: center; padding: 40px; color: #8a8a8a;
    text-transform: uppercase; letter-spacing: 2px; font-size: .9rem;
  }
</style>
</head>
<body>
<div class="container">
  <nav>
    <a href="/">Inicio</a>
    <a href="/usuarios">Usuarios</a>
    <a href="/proveedores">Proveedores</a>
  </nav>

  {{mensaje}}

  <h1>Proveedores</h1>

  <div class="card">
    <h2>Nuevo Proveedor</h2>
    <form method="POST" action="/proveedores/crear">
      <div class="form-row">
        <input name="nombre_empresa" placeholder="Nombre empresa" required>
        <input name="nit_o_rut" placeholder="NIT / RUT" required>
        <input name="telefono" placeholder="Teléfono (opcional)">
        <select name="usuario_id">{{opciones_usuarios}}</select>
      </div>
      <button class="btn btn-success" type="submit">Guardar</button>
    </form>
  </div>

  <h2>Lista de Proveedores</h2>
  {{filas}}
</div>
</body>
</html>
